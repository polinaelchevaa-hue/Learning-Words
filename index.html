:root{
  --bg:#f5f0e6; --paper:#fffaf2; --ink:#3e2723; --muted:#7d6660; --line:#e6dccd;
  --lime:#3e2723; --lime-soft:#f4c9d6; --blue:#3e2723; --blue-soft:#f8dde5;
  --pink:#f4c9d6; --esp:#3e2723;
  --ok:#4f7a52; --ok-soft:#e5efd9; --bad:#b2445c; --bad-soft:#fbe1e8;
  --display:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --body:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#241715;--paper:#2f201d;--ink:#f5f0e6;--muted:#cbb7b0;--line:#4a3430;--lime:#f4c9d6;--lime-soft:#5a3a42;--blue:#f4c9d6;--blue-soft:#4a3036;--pink:#f4c9d6;--esp:#3e2723;--ok:#a7cf9c;--ok-soft:#2f3d29;--bad:#f2a1b6;--bad-soft:#4a2830;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241715;--paper:#2f201d;--ink:#f5f0e6;--muted:#cbb7b0;--line:#4a3430;--lime:#f4c9d6;--lime-soft:#5a3a42;--blue:#f4c9d6;--blue-soft:#4a3036;--pink:#f4c9d6;--esp:#3e2723;--ok:#a7cf9c;--ok-soft:#2f3d29;--bad:#f2a1b6;--bad-soft:#4a2830;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;color:var(--pink);font-size:clamp(34px,8vw,54px);line-height:1.05;margin:0;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--pink);opacity:.85;font-size:15px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 14px;font-weight:600}
.chip.on{background:var(--lime-soft);border-color:var(--lime)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 8px;font-weight:700;text-align:center}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.tab.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card{display:grid;grid-template-columns:1fr minmax(0,240px);gap:18px;align-items:center;min-height:300px;cursor:pointer;border:none;background:none;text-align:center;padding:0;width:100%}
.card .txt{display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;min-width:0}
.ru{font-size:clamp(26px,5vw,34px);font-weight:700}
.ex{font-family:var(--display);font-style:italic;font-size:clamp(22px,4.4vw,30px);line-height:1.35}
.pic{aspect-ratio:4/5;width:100%;max-width:240px;border-radius:24px;border:5px solid var(--blue-soft);background:var(--lime-soft);display:flex;align-items:center;justify-content:center;font-size:clamp(80px,16vw,120px);margin:0 auto;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.back{grid-column:1/-1;font-size:clamp(40px,9vw,64px);font-weight:300;letter-spacing:.01em}
.hint{color:var(--muted);font-size:13.5px;text-align:center}
.nav{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.btn{border:none;background:var(--blue);color:var(--bg);border-radius:12px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.round{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-size:20px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;min-width:5ch;text-align:center}
.star.on{color:#e0a92e;border-color:#e0a92e}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);width:0;transition:width .3s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;font-size:18px;font-weight:600}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{text-align:center;font-weight:700;min-height:1.5em}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.gapin{font:inherit;font-size:22px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:min(320px,100%);text-align:center}
.gapin.ok{border-color:var(--ok);background:var(--ok-soft)}.gapin.bad{border-color:var(--bad);background:var(--bad-soft)}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:30px 0}
.done b{font-family:var(--display);font-style:italic;font-size:34px;color:var(--lime)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;font-size:15px}
.list div{background:var(--bg);border-radius:10px;padding:6px 10px}
.list span{color:var(--muted)}
details summary{cursor:pointer;color:var(--blue);font-weight:600}
.crumbs{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs button{border:none;background:none;color:var(--blue);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.fh{font-family:var(--display);font-style:italic;color:var(--blue);font-size:clamp(26px,5vw,34px);margin:6px 0 10px}
#app{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:18px;padding:18px}
.tile .ic{font-size:40px;line-height:1}.tile b{font-size:20px}.tile small{color:var(--muted)}
.tile:hover,.mod:hover{border-color:var(--lime)}
.mods{display:flex;flex-direction:column;gap:10px}
.mod{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 16px}
.mod .ic{width:52px;height:52px;border-radius:14px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:26px}
.mod b{display:block;font-size:18px}.mod small{color:var(--muted)}.mod .go{color:var(--blue);font-size:22px}
.review{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;border:1.5px solid var(--lime);background:var(--lime-soft);border-radius:16px;padding:14px 16px;margin-bottom:10px;width:100%}
.review .ic{width:52px;height:52px;border-radius:14px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:26px}
.review b{display:block;font-size:18px}.review small{color:var(--muted)}.review .go{color:var(--blue);font-size:22px}
.sort{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;font-variant-numeric:tabular-nums}
.done .sort{justify-content:center;gap:20px;font-size:18px}
.sort .k{color:var(--ok)}.sort .u{color:var(--bad)}
.kbtn{flex:1;max-width:220px;border-radius:14px;padding:12px;font-weight:700;font-size:16px;border:2px solid}
.kbtn.k{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.kbtn.u{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.weakbox{background:var(--paper);border:1.5px dashed var(--bad);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.weakbox .wh{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:14px}
.wi{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wi .x{border:1.5px solid var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:8px;width:32px;height:30px;font-weight:700;flex:none}
.weakchip.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.weakrev{border-color:var(--bad);background:var(--bad-soft)}
.frontsel .lbl{color:var(--muted);font-size:14px;font-weight:600}
.back2{grid-column:1/-1;display:flex;flex-direction:column;gap:18px;align-items:center}
.ex b{font-style:normal;color:var(--bad)}
.full{display:flex;flex-direction:column;gap:4px;align-items:center;margin-top:6px;color:var(--ink);font-weight:400}
.full .ex{font-size:clamp(20px,4vw,26px)}
.full .term{font-size:15px;color:var(--muted);font-weight:600}
.pg{display:flex;align-items:center;gap:8px;margin-top:6px;width:100%}
.pgb{flex:1;max-width:180px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.pgb i{display:block;height:100%;background:var(--ok)}
.pgt{font-size:13px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-size:22px;color:var(--blue)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt{min-height:78px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:8px;font-size:15px;font-weight:600;line-height:1.25;transition:opacity .25s,transform .15s}
.mt.en{background:var(--blue-soft)}
.mt.sel{border-color:var(--lime);box-shadow:0 0 0 2px var(--lime)}
.mt.good{background:var(--ok-soft);border-color:var(--ok)}
.mt.gone{opacity:0;pointer-events:none}
.mt.wrong{background:var(--bad-soft);border-color:var(--bad);transform:translateX(3px)}
.gname{margin:0;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.glinks{background:var(--paper);border:1.5px dashed var(--blue-soft);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.gl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gl b{display:block}.gl small{color:var(--muted)}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--lime-soft);color:var(--ink);padding:4px 10px;border-radius:8px;text-decoration:none;font-weight:700}
.locked{min-height:40vh;justify-content:center}
.pgb i{background:var(--bad)}
.hero{background:var(--esp);border-radius:26px;padding:24px 56px 26px 24px;position:relative}
.hero::after{content:"♥";position:absolute;right:22px;bottom:18px;color:var(--pink);font-size:26px}
.fh{font-family:var(--display);font-style:normal;font-weight:700}
.done b{font-family:var(--display);font-style:normal;font-weight:700;color:var(--ink)}
.ex{font-family:Georgia,"Times New Roman",serif}
.tile{border-radius:22px}.tile:nth-child(odd){background:var(--pink);border-color:var(--pink)}
.tile .ic{font-size:36px}
.round:disabled{opacity:.4;cursor:default}
@media (max-width:600px){.mgrid{grid-template-columns:repeat(3,1fr)}.tabs{grid-template-columns:repeat(2,1fr)}.card{grid-template-columns:1fr;min-height:0}.pic{max-width:180px;order:-1}.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function emptyWeak(){$("panel").innerHTML=`<div class="done"><b>Nothing here yet ✨</b><span>Words you mark <b>✗ Still learning</b> or get wrong will appear here.</span><button class="btn" id="toall">Study all words</button></div>`;$("toall").onclick=()=>{scope="all";runMode()}}
function weakList(){const box=$("weakbox");if(!box)return;const t=weak(),here=Wfull().filter(w=>t.includes(w[0]));
  box.innerHTML=`<div class="wh"><b>📌 Still learning · ${here.length}</b>${here.length?`<button class="btn ghost sm" id="wclear">Clear list</button>`:""}</div>`+(here.length?`<div class="list">${here.map(w=>`<div class="wi"><span><b>${w[0]}</b> <span>— ${w[1]}</span></span><button class="x" data-w="${w[0].replace(/"/g,'&quot;')}" aria-label="I know it now" title="I know it now">✓</button></div>`).join("")}</div>`:`<p class="hint" style="text-align:left;margin:0">Mark words with ✗ in Flashcards, or make a mistake in Learn or Gap fill, and they appear here.</p>`);
  box.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{setWeak(b.dataset.w,false);weakList();scopeBar()});
  if($("wclear"))$("wclear").onclick=()=>{here.forEach(w=>setWeak(w[0],false));weakList();scopeBar()}}
function frontBar(){const fb=$("frontsel");if(!fb)return;fb.innerHTML=`<span class="lbl">Card front:</span><button class="chip ${front==="ru"?"on":""}" data-fr="ru">RU → EN</button><button class="chip ${front==="en"?"on":""}" data-fr="en">EN → RU</button>${mode==="gap"?`<span class="lbl">(Gap fill is always in English)</span>`:""}`;
  fb.querySelectorAll("[data-fr]").forEach(b=>b.onclick=()=>{front=b.dataset.fr;store.set("front",front);runMode()})}
function scopeBar(){const n=Wfull().filter(w=>weak().includes(w[0])).length;const sb=$("scope");if(!sb)return;
  sb.innerHTML=`<button class="chip ${scope==="all"?"on":""}" data-sc="all">All words · ${Wfull().length}</button><button class="chip weakchip ${scope==="weak"?"on":""}" data-sc="weak">📌 Still learning · ${n}</button>`;
  sb.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{scope=b.dataset.sc;runMode()})}
function note(t){const p=document.createElement("p");p.className="fb bad";p.textContent=t;$("panel").appendChild(p);setTimeout(()=>p.remove(),2200)}

/* Flashcards: sort into know / still learning */
let order=[],pos=0,flipped=false,onlyStars=false,known=[],unknown=[],hist=[],RW=[];
function cardsNew(list){RW=W().slice();order=list;pos=0;flipped=false;known=[];unknown=[];hist=[]}
function cards(){
  const st=stars();
  if(!order.length){if(!W().length){emptyWeak();return}let pool=W().map((_,i)=>i);if(onlyStars&&st.length)pool=pool.filter(i=>st.includes(W()[i][0]));cardsNew(mI<0?shuffle(pool):pool)}
  if(pos>=order.length){
    $("panel").innerHTML=`<div class="done"><b>Round finished! 🎉</b>
    <div class="sort"><span class="k">✓ Know: ${known.length}</span><span class="u">✗ Still learning: ${unknown.length}</span></div>
    <div class="nav">${unknown.length?`<button class="btn" id="again2">Study the ${unknown.length} again</button>`:""}<button class="btn ghost" id="restart">Start over</button></div>
    ${unknown.length?`<div class="list" style="width:100%;text-align:left">${unknown.map(i=>`<div><b>${RW[i][0]}</b> <span>— ${RW[i][1]}</span></div>`).join("")}</div>`:"<span>You know all the words! 🌟</span>"}</div>`;
    if(unknown.length)$("again2").onclick=()=>{cardsNew(shuffle(unknown.slice()));cards()};
    $("restart").onclick=()=>{order=[];cards()};return}
  const i=order[pos],w=RW[i];
  $("panel").innerHTML=`<div class="sort"><span class="u">✗ ${unknown.length}</span><span class="count">${pos+1} / ${order.length}</span><span class="k">✓ ${known.length}</span></div>
  <button class="card" id="flip" aria-label="Flip the card">${front==="en"?(flipped?ruBack(w):enFront(w)):(flipped?`<div class="back">${w[0]}</div>`:prompt(w))}</button>
  <p class="hint">${flipped?"Tap to see the front again":front==="en"?"Tap the card to see the translation":"Tap the card to see the English word"}</p>
  <div class="nav"><button class="kbtn u" id="no">✗ Still learning</button><button class="kbtn k" id="yes">✓ I know it</button></div>
  <div class="nav"><button class="round" id="undo" aria-label="Back" ${hist.length?"":"disabled"}>↶</button><button class="round" id="speak" aria-label="Listen">🔊</button><button class="round star ${st.includes(w[0])?"on":""}" id="star" aria-label="Star this word">★</button>
  <button class="btn ghost" id="mix">Shuffle</button><button class="btn ghost" id="onlyst">${onlyStars?"All words":"Only ★ words"}</button></div>`;
  $("flip").onclick=()=>{flipped=!flipped;cards()};
  if(front==="en"&&!flipped&&!cards.spoke){cards.spoke=1;setTimeout(()=>cards.spoke=0,50)}
  const mark=k=>{(k?known:unknown).push(i);setWeak(w[0],!k);weakList();scopeBar();hist.push(k);pos++;flipped=false;cards()};
  $("yes").onclick=()=>mark(true);$("no").onclick=()=>mark(false);
  $("undo").onclick=()=>{if(!hist.length)return;const k=hist.pop();(k?known:unknown).pop();pos--;flipped=false;cards()};
  $("speak").onclick=()=>say(w[0]);
  $("star").onclick=()=>{let s=stars();s=s.includes(w[0])?s.filter(x=>x!==w[0]):[...s,w[0]];store.set(key(),s);cards()};
  $("mix").onclick=()=>{cardsNew(shuffle(order.slice()));cards()};
  $("onlyst").onclick=()=>{if(!onlyStars&&!stars().length){note("Tap ★ on some cards first.");return}onlyStars=!onlyStars;order=[];cards()};
}
/* Learn */
let q=[],learned=0,total=0,LW=[];
function learnStart(){if(!W().length){emptyWeak();return}LW=W().slice();q=shuffle(LW.map((_,i)=>i));learned=0;total=q.length;learn()}
function learn(){
  if(!q.length){$("panel").innerHTML=`<div class="done"><b>All learned! 🎉</b><span>You know all ${total} words.</span><button class="btn" id="again">Learn again</button></div>`;$("again").onclick=learnStart;return}
  const i=q[0],w=LW[i];
  const opts=shuffle([i,...shuffle(LW.map((_,k)=>k).filter(k=>k!==i)).slice(0,3)]);
  $("panel").innerHTML=`<div class="bar"><i style="width:${learned/total*100}%"></i></div><p class="hint">${learned} / ${total} learned</p>
  <div class="card" style="cursor:default">${front==="en"?enFront(w):prompt(w)}</div>
  <div class="nav"><button class="round" id="spk" aria-label="Listen">🔊</button></div>
  <div class="opts">${opts.map(k=>`<button class="opt" data-k="${k}">${LW[k][front==="en"?1:0]}</button>`).join("")}</div><div class="fb" id="fb"></div>`;
  $("spk").onclick=()=>say(w[0]);
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===i)x.classList.add("ok")});
    const ok=+b.dataset.k===i;q.shift();
    if(ok){learned++;if(!weak().includes(w[0]))setWeak(w[0],false);$("fb").className="fb ok";$("fb").textContent="Correct! ✨"}
    else{b.classList.add("bad");setWeak(w[0],true);weakList();scopeBar();q.splice(Math.min(3,q.length),0,i);$("fb").className="fb bad";$("fb").textContent="Not quite. You'll see this word again soon."}
    setTimeout(learn,ok?900:1800);
  });
}
/* Match game */
let mt=null,mStart=0,mSel=null,mLeft=0,mPen=0;
const bestKey=()=>"best_"+LIB[fI].name+"_"+M().name+"_"+scope;
function matchStart(){
  clearInterval(mt);if(W().length<2){emptyWeak();return}
  const pick=shuffle(W().map((_,i)=>i)).slice(0,6),MW=W();
  const tiles=shuffle(pick.flatMap(i=>[{i,t:MW[i][0],en:1},{i,t:MW[i][1],en:0}]));
  mLeft=pick.length;mSel=null;mPen=0;const best=store.get(bestKey(),null);
  $("panel").innerHTML=`<div class="sort"><span class="timer" id="mtime">0.0 s</span><span class="count">Best: ${best?best.toFixed(1)+" s":"—"}</span></div>
  <p class="hint">Tap an English word, then its translation. A wrong pair adds 1 second!</p>
  <div class="mgrid">${tiles.map((x,k)=>`<button class="mt ${x.en?"en":""}" data-i="${x.i}" data-k="${k}">${x.t}</button>`).join("")}</div>
  <div class="nav"><button class="btn ghost" id="mre">New game</button></div>`;
  mStart=performance.now();mt=setInterval(()=>{const e=$("mtime");if(!e){clearInterval(mt);return}e.textContent=((performance.now()-mStart)/1000+mPen).toFixed(1)+" s"},100);
  $("mre").onclick=matchStart;
  document.querySelectorAll(".mt").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("gone"))return;
    if(!mSel){mSel=b;b.classList.add("sel");return}
    if(mSel===b){b.classList.remove("sel");mSel=null;return}
    const a=mSel;mSel=null;a.classList.remove("sel");
    if(a.dataset.i===b.dataset.i&&a.classList.contains("en")!==b.classList.contains("en")){
      [a,b].forEach(x=>{x.classList.add("good");setTimeout(()=>x.classList.add("gone"),250)});
      if(--mLeft===0){clearInterval(mt);const t=(performance.now()-mStart)/1000+mPen;const old=store.get(bestKey(),null);const nb=!old||t<old;if(nb)store.set(bestKey(),t);
        setTimeout(()=>{$("panel").innerHTML=`<div class="done"><b>${t.toFixed(1)} seconds!</b><span>${nb?"🏆 New best time!":"Best: "+old.toFixed(1)+" s"}</span><button class="btn" id="mag">Play again</button></div>`;$("mag").onclick=matchStart},350)}
    } else {mPen+=1;[a,b].forEach(x=>{x.classList.add("wrong");setTimeout(()=>x.classList.remove("wrong"),450)})}
  });
}
/* Gap fill */
let g=[],gp=0,gok=0,GW=[];
function gapStart(){if(!W().length){emptyWeak();return}GW=W().slice();g=shuffle(GW.map((_,i)=>i));gp=0;gok=0;gap()}
function gap(){
  if(gp>=g.length){$("panel").innerHTML=`<div class="done"><b>${gok} / ${g.length}</b><span>${gok===g.length?"Perfect! 🌟":"Great job! Try again to get them all."}</span><button class="btn" id="again">Start again</button></div>`;$("again").onclick=gapStart;return}
  const i=g[gp],w=GW[i],ans=w[3].split("|");
  $("panel").innerHTML=`<div class="bar"><i style="width:${gp/g.length*100}%"></i></div><p class="hint">${gp+1} / ${g.length} · correct: ${gok}</p>
  <div class="card" style="cursor:default">${prompt(w)}</div>
  <form class="nav" id="gf"><input class="gapin" id="gi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Write the missing word" placeholder="write the word"><button class="btn" type="submit">Check</button></form>
  <div class="fb" id="fb"></div><div class="nav"><button class="round" id="spk" aria-label="Listen">🔊</button><button class="btn ghost" id="skip">Show answer</button></div>`;
  const inp=$("gi");let checked=false;$("spk").onclick=()=>say(w[0]);const next=()=>{gp++;gap()};
  const show=ok=>{checked=true;weakList();scopeBar();inp.classList.add(ok?"ok":"bad");$("fb").className="fb "+(ok?"ok":"bad");$("fb").innerHTML=(ok?"Correct! ✨":"Answer:")+`<div class="full"><span class="ex">${filled(w)}</span><span class="term">${w[0]} — ${w[1]}</span></div>`;document.querySelector("#gf .btn").textContent="Next →"};
  $("gf").onsubmit=e=>{e.preventDefault();if(checked){next();return}if(!inp.value.trim())return;const ok=ans.some(a=>norm(a)===norm(inp.value));if(ok){gok++;if(!weak().includes(w[0]))setWeak(w[0],false)}else setWeak(w[0],true);show(ok)};
  $("skip").onclick=()=>{if(checked){next();return}inp.value=ans[0];setWeak(w[0],true);show(false)};
}
const saved=store.get("pos",null);
if(saved&&OK.includes(saved.fI)&&(saved.view!=="module"||saved.mI<0||LIB[saved.fI].modules[saved.mI])){view=saved.view;fI=saved.fI;mI=saved.mI??0}
window.addEventListener("hashchange",()=>{access();view="home";scope="all";draw()});
draw();

</script>
</body></html>
